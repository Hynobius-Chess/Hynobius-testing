name: Self Play Smoke Test

on:
  workflow_call:
    inputs:
      baseline_ref:
        description: "Baseline git ref (tag / branch / commit)"
        required: false
        default: "main"
        type: string

      candidate_ref:
        description: "Candidate git ref (tag / branch / commit), empty = caller SHA"
        required: false
        default: ""
        type: string

      opening_pairs:
        description: "Number of paired openings"
        required: false
        default: "10"
        type: string

  workflow_dispatch:
    inputs:
      baseline_ref:
        description: "Baseline git ref (tag / branch / commit)"
        required: false
        default: "main"
        type: string

      candidate_ref:
        description: "Candidate git ref (tag / branch / commit), empty = caller SHA"
        required: false
        default: ""
        type: string

      opening_pairs:
        description: "Number of paired openings"
        required: false
        default: "10"
        type: string

permissions:
  contents: read

jobs:
  ab-match:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          repository: Hynobius-Chess/Hynobius
          fetch-depth: 0
          ref: ${{ inputs.candidate_ref != '' && inputs.candidate_ref || github.sha }}
          path: candidate

      - name: Checkout baseline
        uses: actions/checkout@v4
        with:
          repository: Hynobius-Chess/Hynobius
          fetch-depth: 0
          ref: ${{ inputs.baseline_ref }}
          path: baseline

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            qtbase5-dev \
            qttools5-dev \
            qttools5-dev-tools \
            libqt5svg5-dev

      - name: Build Cute Chess
        shell: bash
        run: |
          git clone --depth 1 --branch v1.3.1 \
            https://github.com/cutechess/cutechess.git \
            "$RUNNER_TEMP/cutechess-src"

          cmake -S "$RUNNER_TEMP/cutechess-src" \
                -B "$RUNNER_TEMP/cutechess-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_TESTING=OFF

          cmake --build "$RUNNER_TEMP/cutechess-build" --target cutechess-cli

          cutechess_cli="$(find "$RUNNER_TEMP/cutechess-build" -type f -name cutechess-cli | head -n 1)"

          if [ -z "$cutechess_cli" ]; then
            echo "cutechess-cli not found"
            find "$RUNNER_TEMP/cutechess-build" -type f
            exit 1
          fi

          chmod +x "$cutechess_cli"

          echo "CUTECHESS_CLI=$cutechess_cli" >> "$GITHUB_ENV"

          "$cutechess_cli" -version || true

      - name: Resolve SHAs
        shell: bash
        run: |
          baseline_sha="$(git -C baseline rev-parse HEAD)"
          candidate_sha="$(git -C candidate rev-parse HEAD)"

          echo "BASELINE_SHA=$baseline_sha" >> "$GITHUB_ENV"
          echo "CANDIDATE_SHA=$candidate_sha" >> "$GITHUB_ENV"

          echo "Baseline SHA:  $baseline_sha"
          echo "Candidate SHA: $candidate_sha"

      - name: Build candidate
        shell: bash
        run: |
          cmake -S candidate \
                -B candidate/build \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release

          cmake --build candidate/build --config Release

      - name: Build baseline
        shell: bash
        run: |
          cmake -S baseline \
                -B baseline/build \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release

          cmake --build baseline/build --config Release

      - name: Prepare output folders
        shell: bash
        run: |
          mkdir -p out/pgn
          mkdir -p out/results

      - name: Resolve executable paths
        shell: bash
        run: |
          baseline_candidates=(
            "baseline/build/chess-analysis-engine"
            "baseline/build/Hynobius"
            "baseline/build/hynobius"
            "baseline/build/Release/chess-analysis-engine"
            "baseline/build/Release/Hynobius"
            "baseline/build/Release/hynobius"
          )

          candidate_candidates=(
            "candidate/build/chess-analysis-engine"
            "candidate/build/Hynobius"
            "candidate/build/hynobius"
            "candidate/build/Release/chess-analysis-engine"
            "candidate/build/Release/Hynobius"
            "candidate/build/Release/hynobius"
          )

          baseline_exe=""

          for p in "${baseline_candidates[@]}"; do
            if [ -f "$p" ] && [ -x "$p" ]; then
              baseline_exe="$(realpath "$p")"
              break
            fi
          done

          if [ -z "$baseline_exe" ]; then
            echo "Baseline executable not found"
            echo "Files under baseline/build:"
            find baseline/build -maxdepth 5 -type f
            exit 1
          fi

          candidate_exe=""

          for p in "${candidate_candidates[@]}"; do
            if [ -f "$p" ] && [ -x "$p" ]; then
              candidate_exe="$(realpath "$p")"
              break
            fi
          done

          if [ -z "$candidate_exe" ]; then
            echo "Candidate executable not found"
            echo "Files under candidate/build:"
            find candidate/build -maxdepth 5 -type f
            exit 1
          fi

          echo "BASELINE_EXE=$baseline_exe" >> "$GITHUB_ENV"
          echo "CANDIDATE_EXE=$candidate_exe" >> "$GITHUB_ENV"

          echo "Baseline executable:  $baseline_exe"
          echo "Candidate executable: $candidate_exe"

      - name: Validate inputs
        shell: bash
        run: |
          pairs="${{ inputs.opening_pairs }}"

          if ! [[ "$pairs" =~ ^[0-9]+$ ]]; then
            echo "opening_pairs must be an integer"
            exit 1
          fi

          if [ "$pairs" -le 0 ]; then
            echo "opening_pairs must be > 0"
            exit 1
          fi

      - name: Run paired-opening match
        shell: bash
        run: |
          timestamp="$(date -u +"%Y-%m-%d_%H-%M-%S")"

          artifact_name="ab-test-${{ github.run_id }}-$timestamp"
          pgn="out/pgn/ab_match_$timestamp.pgn"
          txt="out/results/ab_match_$timestamp.txt"

          pairs="${{ inputs.opening_pairs }}"
          opening_file="candidate/bench/openings.pgn"

          if [ ! -f "$opening_file" ]; then
            echo "Opening file not found: $opening_file"
            exit 1
          fi

          "$CUTECHESS_CLI" \
            -engine name=baseline cmd="$BASELINE_EXE" \
            -engine name=candidate cmd="$CANDIDATE_EXE" \
            -each proto=uci tc=10+0.1 \
            -openings file="$opening_file" format=pgn order=random \
            -rounds "$pairs" \
            -repeat \
            -recover \
            -resign movecount=3 score=800 \
            -draw movenumber=40 movecount=8 score=10 \
            -pgnout "$pgn" \
            | tee "$txt"

          echo "PGN_FILE=$pgn" >> "$GITHUB_ENV"
          echo "RESULT_FILE=$txt" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"

      - name: Upload match artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.PGN_FILE }}
            ${{ env.RESULT_FILE }}