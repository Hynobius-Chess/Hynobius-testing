name: Run Test

on:
  workflow_call:
    inputs:
      engine_ref:
        type: string
        description: "Engine branch, tag, or commit"
        required: false
        default: "main"
  workflow_dispatch:
    inputs:
      engine_ref:
        type: string
        description: "Engine branch, tag, or commit"
        required: false
        default: "main"

jobs:
  perft:
    uses: ./.github/workflows/perft_test.yml
    with:
      engine_ref: ${{ inputs.engine_ref }}

  sanitizers:
    needs: perft
    uses: ./.github/workflows/sanitizers.yml
    with:
      engine_ref: ${{ inputs.engine_ref }}
  
  mate:
    needs: sanitizers
    uses: ./.github/workflows/mate_test.yml
    with:
      engine_ref: ${{ inputs.engine_ref }}

  basic-test:
    needs: sanitizers
    uses: ./.github/workflows/basic_test.yml
    with:
      engine_ref: ${{ inputs.engine_ref }}

  hard-test:
    needs: sanitizers
    uses: ./.github/workflows/hard_test.yml
    with:
      engine_ref: ${{ inputs.engine_ref }}

  very-hard-test:
    needs: sanitizers
    uses: ./.github/workflows/very_hard_test.yml
    with:
      engine_ref: ${{ inputs.engine_ref }}

  self-play-smoke:
    needs: sanitizers
    uses: ./.github/workflows/self_play_smoke.yml
    with:
      baseline_ref: ${{ inputs.engine_ref }}
      candidate_ref:  ${{ inputs.engine_ref }}
      opening_pairs: 20