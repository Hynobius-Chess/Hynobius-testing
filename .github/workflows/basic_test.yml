name: Basic Test

on:
  workflow_call:
    inputs:
      engine_ref:
        type: string
        description: "Engine branch, tag, or commit"
        required: false
        default: "main"

jobs:
  test-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout testing repo
        uses: actions/checkout@v4
        with:
          path: testing

      - name: Checkout engine repo
        uses: actions/checkout@v4
        with:
          repository: Hynobius-Chess/Hynobius
          ref: ${{ inputs.engine_ref }}
          path: engine

      - name: Configure engine
        shell: bash
        run: |
          cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release

      - name: Build engine
        shell: bash
        run: |
          cmake --build engine/build --config Release

      - name: Copy engine executable
        shell: bash
        run: |
          mkdir -p testing/bin
          cp engine/build/Hynobius testing/bin/Hynobius
          chmod +x testing/bin/Hynobius

      - name: Run tests
        working-directory: testing
        shell: bash
        run: |
          python tools/test_controler.py \
            --engine bin/Hynobius \
            --tests \
                tests/basic_tests/basic_deflection_1000.txt \
                tests/basic_tests/basic_discover_attack_1000.txt \
                tests/basic_tests/basic_fork_1000.txt \
                tests/basic_tests/basic_hanging_piece_1000.txt \
                tests/basic_tests/basic_pin_1000.txt \
                tests/basic_tests/basic_skewer_1000.txt \
            --pass-rate 100 \